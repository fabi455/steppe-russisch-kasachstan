name: Steppe Russisch 1.3.1 – Zusatzwort + 20 Lektionen + 56k-Wörterbuch
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: steppe-russisch-android-main
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Android + vollständige Offline-Web-App
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Create verified offline Russian–German dictionary
        run: |
          python3 tools/build_dictionary.py
          python3 -m py_compile tools/build_dictionary.py tools/build_standalone.py
          node --check app.js
          node --check adaptive.js
          node --check dictionary/ui.js
          node --check dictionary/ru-de.js
      - name: Install neural speech engines and local fallback voice
        run: |
          python3 -m pip install --disable-pip-version-check 'edge-tts==7.3.1' 'piper-tts==1.8.0' 'mutagen>=1.47,<2'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p voice
          cd voice
          python3 -m piper.download_voices ru_RU-dmitri-medium
          test -s ru_RU-dmitri-medium.onnx
          test -s ru_RU-dmitri-medium.onnx.json
      - name: Recover existing 128 high-quality Svetlana MP3s
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/restore_legacy_audio.sh
      - name: Generate missing lesson MP3s with local neural voice
        env:
          STEPPE_AUDIO_MODE: local
        run: |
          python3 tools/generate_audio.py
          test "$(find audio -name '*.mp3' | wc -l)" -eq 321
          python3 - <<'PY'
          import json
          from pathlib import Path
          from mutagen.mp3 import MP3
          files = list(Path('audio').glob('*.mp3'))
          assert len(files) == 321, len(files)
          for file in files:
              track = MP3(str(file))
              assert track.info.length > 0.1, file
          print('Validierte 321 MP3-Hörproben', flush=True)
          PY
      - name: Build full offline browser edition
        run: python3 tools/build_standalone.py
      - name: Build installable Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Steppe-Russisch-1.3.1-Wort-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload portable offline HTML edition
        uses: actions/upload-artifact@v4
        with:
          name: Steppe-Russisch-1.3.1-Offline-Web
          path: dist/Steppe-Russisch-1.3.1-Offline.html
          if-no-files-found: error
          retention-days: 90
