name: Steppe Android + In-App-Aktualisierungen
on:
  push:
    branches: [main]
    paths:
      - android/**
      - app.js
      - index.html
      - adaptive.js
      - dictionary/ui.js
      - style.css
      - sw.js
      - tools/build_content_update.py
      - tools/publish_content_update.py
      - tools/build_standalone.py
      - .github/workflows/android-apk.yml
  workflow_dispatch:
concurrency:
  group: steppe-russisch-android-main
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    name: Android 1.4 + geprüftes Offline-Lernpaket
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate verified Russian–German dictionary
        run: |
          python3 tools/build_dictionary.py
          python3 -m py_compile tools/build_dictionary.py tools/build_standalone.py tools/build_content_update.py tools/publish_content_update.py tools/generate_audio.py
          node --check app.js
          node --check adaptive.js
          node --check dictionary/ui.js
          node --check dictionary/ru-de.js
      - name: Install neural speech engines and local fallback voice
        run: |
          python3 -m pip install --disable-pip-version-check 'edge-tts==7.3.1' 'piper-tts==1.8.0' 'mutagen>=1.47,<2'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p voice
          (cd voice && python3 -m piper.download_voices ru_RU-dmitri-medium)
      - name: Restore existing verified neural MP3s
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/restore_legacy_audio.sh
      - name: Generate missing neural MP3s
        env:
          STEPPE_AUDIO_MODE: local
        run: |
          python3 tools/generate_audio.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from mutagen.mp3 import MP3
          lessons=json.loads(Path('content.json').read_text(encoding='utf-8'))
          ids=[w['id'] for l in lessons for w in l['words']+l['phrases']]
          assert len(ids)>=321 and len(set(ids))==len(ids)
          for id in ids:
              f=Path('audio')/(id+'.mp3')
              assert f.is_file() and MP3(str(f)).info.length>0.1,f
          print('Validierte',len(ids),'natürlichere MP3-Hörproben')
          PY
      - name: Build signed content-only package and native revision metadata
        run: python3 tools/build_content_update.py
      - name: Build full offline browser edition
        run: python3 tools/build_standalone.py
      - name: Build installable Android test APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug -PsteppeVersionCode=$((1000 + GITHUB_RUN_NUMBER)) -PsteppeVersionName="1.4.${GITHUB_RUN_NUMBER}"
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: Steppe-1.4-Update-System-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Restore optional stable release signing key from GitHub Secrets
        env:
          STEPPE_KEYSTORE_B64: ${{ secrets.STEPPE_KEYSTORE_B64 }}
          STEPPE_STORE_PASSWORD_SECRET: ${{ secrets.STEPPE_STORE_PASSWORD }}
          STEPPE_KEY_PASSWORD_SECRET: ${{ secrets.STEPPE_KEY_PASSWORD }}
          STEPPE_KEY_ALIAS_SECRET: ${{ secrets.STEPPE_KEY_ALIAS }}
        run: |
          if [ -n "$STEPPE_KEYSTORE_B64" ]; then
            echo "$STEPPE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/steppe-release.jks"
            echo "STEPPE_KEYSTORE_PATH=$RUNNER_TEMP/steppe-release.jks" >> "$GITHUB_ENV"
            echo "STEPPE_STORE_PASSWORD=$STEPPE_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "STEPPE_KEY_PASSWORD=$STEPPE_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "STEPPE_KEY_ALIAS=$STEPPE_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "No persistent signing key configured: debug APK only. App-code upgrades still require a one-time GitHub Secrets setup."
          fi
      - name: Build stable-signed release APK
        if: env.STEPPE_KEYSTORE_PATH != ''
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleRelease -PsteppeVersionCode=$((1000 + GITHUB_RUN_NUMBER)) -PsteppeVersionName="1.4.${GITHUB_RUN_NUMBER}"
      - name: Publish stable-signed Android update
        if: env.STEPPE_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.4.${GITHUB_RUN_NUMBER}"
          gh release create "v$VERSION" "android/app/build/outputs/apk/release/app-release.apk#Steppe-Russisch-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" --title "Steppe Russisch $VERSION" --notes "Stabil signierte App-Aktualisierung. Gleicher App-Signaturschlüssel für alle folgenden Versionen erforderlich." --latest
      # Content packages are published exclusively by content-updates.yml after all
      # 321 clips pass the single-Svetlana-voice verification. Never overwrite those
      # files from a potentially mixed-voice Android build.
      - name: Upload complete offline HTML app
        uses: actions/upload-artifact@v4
        with:
          name: Steppe-1.4-Offline-Web
          path: dist/Steppe-Russisch-1.4-Offline.html
          if-no-files-found: error
          retention-days: 90
      - name: Upload content-only ZIP for inspection
        uses: actions/upload-artifact@v4
        with:
          name: Steppe-1.4-Lernpaket
          path: dist/steppe-content.zip
          if-no-files-found: error
          retention-days: 90
