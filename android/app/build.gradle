plugins { id 'com.android.application' }

android {
    namespace 'com.steppe.russisch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.steppe.russisch'
        minSdk 24
        targetSdk 35
        // CI increments the code for Android's in-place APK update checks.
        versionCode providers.gradleProperty('steppeVersionCode').orElse('6').get().toInteger()
        versionName providers.gradleProperty('steppeVersionName').orElse('1.4.0').get()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Keep the private signing keystore OUT of the public GitHub repository.
    // Set GitHub Actions secrets for the first stable signed release.
    signingConfigs {
        steppeRelease {
            storeFile file(System.getenv('STEPPE_KEYSTORE_PATH') ?: 'not-configured.jks')
            storePassword System.getenv('STEPPE_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('STEPPE_KEY_ALIAS') ?: 'steppe'
            keyPassword System.getenv('STEPPE_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            if (System.getenv('STEPPE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.steppeRelease
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs = [layout.buildDirectory.dir('generated/steppeAssets')]
        }
    }
}

tasks.register('prepareSteppeAssets', Copy) {
    def root = rootProject.projectDir.parentFile
    from(root) {
        include 'index.html', 'style.css', 'app.js', 'adaptive.js', 'content.js', 'content.json', 'manifest.webmanifest', 'updates/update-revision.json'
        include 'audio/**', 'icons/**', 'dictionary/**'
    }
    into layout.buildDirectory.dir('generated/steppeAssets')
}
tasks.named('preBuild') { dependsOn('prepareSteppeAssets') }
